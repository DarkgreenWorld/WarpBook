# Gradle
# The https.protocols settings force TLS 1.2/1.3 for downloads (Mojang, Fabric maven),
# which avoids SSL handshake failures on some networks
org.gradle.jvmargs=-Xmx2G -Dhttps.protocols=TLSv1.2,TLSv1.3
systemProp.https.protocols=TLSv1.2,TLSv1.3

# Minecraft / Fabric, see https://fabricmc.net/develop
minecraft_version=1.20.1
parchment_minecraft=1.20.1
parchment_version=2023.09.03
fabric_loader_version=0.16.9
# The part after "+" must be exactly the Minecraft version
fabric_version=0.92.2+1.20.1

# Mod
mod_id=warp_book
mod_version=4.0.4
mod_name=Warp Book
mod_license=GPL-v3.0-only
mod_authors=Panicnot42, FerreusVeritas, DarkgreenWorld, MelonVRneu, ArcAnc
mod_description=Magic book which allows you to make magical teleports.
maven_group=com.panicnot42.warp_book
